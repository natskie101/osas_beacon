<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Choose health, not smoke — smoke-free campus advocacy poster">
  <rect width="640" height="400" fill="#f6f7f9"/>

  <!-- No-smoking symbol -->
  <g>
    <!-- cigarette -->
    <rect x="70" y="168" width="58" height="24" rx="6" fill="#e8a33d"/>
    <rect x="126" y="168" width="92" height="24" fill="#ffffff" stroke="#d7dbe1" stroke-width="2"/>
    <rect x="214" y="168" width="18" height="24" rx="5" fill="#d92b2b"/>
    <!-- smoke -->
    <path d="M166 152c14-12-14-24 0-36" fill="none" stroke="#b9bfc7" stroke-width="7" stroke-linecap="round"/>
    <path d="M198 148c14-12-14-24 0-36" fill="none" stroke="#c9ced5" stroke-width="6" stroke-linecap="round"/>
    <!-- ring + slash -->
    <circle cx="150" cy="180" r="94" fill="none" stroke="#d92b2b" stroke-width="24"/>
    <line x1="84" y1="246" x2="216" y2="114" stroke="#d92b2b" stroke-width="24" stroke-linecap="round"/>
  </g>

  <!-- Slogan -->
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-style="italic">
    <text x="290" y="132" font-size="56" font-weight="800" fill="#111827">CHOOSE</text>
    <text x="290" y="212" font-size="74" font-weight="900" fill="#d92b2b">HEALTH</text>
    <text x="290" y="274" font-size="54" font-weight="800" fill="#111827">NOT SMOKE</text>
  </g>

  <!-- Caption -->
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" fill="#6b7280" font-size="13">
    <text x="290" y="312">Smoking is prohibited within the campus premises.</text>
    <text x="290" y="334">Keep SCT clean, healthy and smoke-free.</text>
    <text x="290" y="374" font-size="14" font-weight="700" letter-spacing="1.6" fill="#7a1420">OFFICE OF STUDENT AFFAIRS</text>
  </g>

  <!-- Advocacy marks -->
  <g transform="translate(110,344)">
    <circle r="17" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
    <path d="M0,6 C-7,0 -6,-6 -2,-7 C-0.5,-7.3 0,-6 0,-5 C0,-6 0.5,-7.3 2,-7 C6,-6 7,0 0,6 Z" fill="#d92b2b"/>
  </g>
  <g transform="translate(152,344)">
    <circle r="17" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
    <path d="M-7,7 C-7,-3 -1,-7 7,-7 C7,1 3,7 -7,7 Z" fill="#16a34a"/>
    <path d="M-5,5 L5,-5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <g transform="translate(194,344)">
    <circle r="17" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
    <path d="M-5,0 l3.5,3.5 L6,-4" fill="none" stroke="#1a67d8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
