<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="BEACON — Information Broadcasting and Student Services System of the Office of Student Affairs and Services, University of Cebu — Lapu-Lapu and Mandaue.">
<title>BEACON · OSAS Portal Sign-In</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="login">

<div class="auth">
  <section class="auth__panel auth__left">
    <div class="auth__brand" id="auth-brand"></div>
    <div class="auth__dots" id="auth-dots"></div>
    <div class="auth__corner" id="auth-corner"></div>
  </section>

  <section class="auth__panel auth__right">
    <div class="auth__form">
      <h1 class="auth__title">Sign in to Portal</h1>
      <p class="auth__subtitle">Use your Information Account to Continue</p>
      <div id="auth-alert" class="u-mt-14"></div>

      <form id="login-form" class="form-grid" novalidate>
        <div class="field">
          <label for="email">Email Address</label>
          <span class="input-group">
            <span class="input-group__ico"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/></svg></span>
            <input class="input" id="email" type="email" placeholder="University email address" autocomplete="username">
          </span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <span class="input-group input-group--action">
            <span class="input-group__ico"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg></span>
            <input class="input" id="password" type="password" placeholder="Enter your password" autocomplete="current-password">
            <button type="button" class="input-group__btn" id="password-toggle" title="Show password" aria-label="Show password"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </span>
        </div>

        <div class="u-between">
          <label class="check"><input type="checkbox" id="remember"> <span>Remember this device</span></label>
          <a class="link" href="#" id="forgot-password">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn--primary btn--block" id="login-submit">Login</button>
        <div class="divider">or</div>
        <button type="button" class="btn btn--outline btn--block" id="create-account">Create Account</button>
      </form>

      <div class="auth__hint" id="auth-hint"></div>
      <p class="u-center u-mt-8"><a class="link" href="#" id="fill-demo">Re-fill administrator credentials</a></p>

      <div class="auth__foot">
        <span>Contact OSAS Support</span>
        <a href="mailto:osas.support@uc.edu.ph">osas.support@uc.edu.ph</a>
        <span>·</span>
        <a href="#" onclick="return false;">Data Privacy Policy</a>
      </div>
    </div>
  </section>
</div>

<div id="modal-root" class="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="assets/js/seed.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/forms.js"></script>
<script src="assets/js/pages/login.js"></script>
</body>
</html>
