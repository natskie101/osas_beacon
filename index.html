<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Sign-In · BEACON OSAS Portal</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="login">
<div id="shell"></div>
<div id="modal-root" class="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<!-- Login Page Content -->
<main class="auth" id="auth-main">
  <div class="auth__panel auth__left" id="auth-brand">
    <div class="auth__brand"></div>
  </div>
  <div class="auth__panel auth__right">
    <div class="auth__form">
      <div class="auth__header">
        <h1 class="auth__title">Welcome back</h1>
        <p class="auth__subtitle">Sign in to access the BEACON OSAS Portal</p>
      </div>
      <div id="auth-alert"></div>
      <form class="auth__form-inner" id="login-form" novalidate>
        <div class="field">
          <label for="email">University Email Address</label>
          <span class="input-group">
            <span class="input-group__ico" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
            <input class="input" id="email" type="email" placeholder="juan.delacruz@uc.edu.ph" autocomplete="username" required>
          </span>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <span class="input-group">
            <span class="input-group__ico" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input class="input" id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="input-group__toggle" id="password-toggle" aria-label="Show password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </span>
        </div>
        <div class="field field--inline">
          <label class="checkbox">
            <input type="checkbox" id="remember">
            <span class="checkbox__box"></span>
            <span>Remember me</span>
          </label>
          <a href="#" class="link" id="forgot-password">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn--primary btn--block" id="login-submit">Sign In</button>
      </form>
      <div class="auth__foot">
        <p class="auth__hint" id="auth-hint"></p>
        <button type="button" class="btn btn--ghost btn--sm" id="fill-demo">Fill demo credentials</button>
        <p class="auth__signup">Don't have an account? <a href="#" id="create-account">Create one</a></p>
      </div>
    </div>
  </div>
  <div class="auth__corner" id="auth-corner"></div>
  <div class="auth__dots" id="auth-dots" role="tablist" aria-label="Feature highlights"></div>
</main>

<script src="assets/js/seed.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/forms.js"></script>
<script src="assets/js/pagekit.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/pages/login.js"></script>
</body>
</html>
