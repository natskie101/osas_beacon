services:
  - type: web
    name: osas-beacon
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_DEMO_MODE
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE
        value: "true"
      - key: CACHE_STORE
        value: file
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        # Aiven for PostgreSQL direct connection. NOT the pooler.
        # Taken from: Aiven console > service > Overview > Connection Information
        value: pg-2c2d6ca1-carlosnath991-aec2.h.aivencloud.com
      - key: DB_PORT
        # Aiven assigned a non-default port for this service - copied from the
        # console. Do not "fix" this back to 5432; it will not connect.
        value: "26572"
      - key: DB_SSLMODE
        value: require
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: ssl
      - key: MAIL_TIMEOUT
        value: "15"
      - key: MAIL_FROM_ADDRESS
        value: carlosnath991@gmail.com
      - key: MAIL_FROM_NAME
        value: BEACON OSAS Portal
      - key: BREVO_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_DEFAULT_MODEL
        value: meta/llama-3.3-70b-instruct
      - key: NVIDIA_REQUEST_TIMEOUT
        value: "60"
      # Cloudflare R2 (S3-compatible) object storage for module media.
      # The bucket is private; reads go through a signed redirect issued by
      # FileStorage::download(). Set the three secrets in the Render dashboard.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        value: osas-portal-media
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
