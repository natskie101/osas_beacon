services:
  - type: web
    name: osas-beacon
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_DEMO_MODE
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE
        value: "true"
      - key: CACHE_STORE
        value: file
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        # Neon's DIRECT endpoint (host WITHOUT "-pooler"). The pooler +
        # PDO prepared statements silently abort transactions (SQLSTATE
        # 25P02) during migrations. Render is a persistent server, which
        # is exactly what the direct endpoint is for.
        # NOTE: this value is managed by the blueprint on purpose — an
        # earlier hand-typed value in the Render dashboard contained a
        # stray " <- no -pooler" annotation, which made libpq fail to
        # parse the DSN (SQLSTATE 08006) and 500'd every page.
        value: ep-weathered-hat-a1ets3w2.ap-southeast-1.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: require
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: osas.support@uc.edu.ph
      - key: MAIL_FROM_NAME
        value: BEACON OSAS Portal
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_DEFAULT_MODEL
        value: meta/llama-3.3-70b-instruct
      - key: NVIDIA_REQUEST_TIMEOUT
        value: "60"